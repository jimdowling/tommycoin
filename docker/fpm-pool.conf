[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pass all container environment variables (APP_KEY, APP_DEBUG, etc.) through to PHP
clear_env = no

; Log PHP errors to stderr so they appear in Koyeb logs
php_flag[display_errors] = on
php_flag[log_errors] = on
php_value[error_log] = /proc/self/fd/2
php_value[error_reporting] = E_ALL
