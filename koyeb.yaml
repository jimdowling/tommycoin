# Koyeb deployment configuration for TommyCoin
# Deploy via: koyeb app create tommycoin --docker ./Dockerfile
# Or connect your GitHub repo in the Koyeb dashboard.

name: tommycoin

services:
  - name: web
    type: web
    docker:
      dockerfile: Dockerfile
    instance_type: nano
    regions:
      - fra                   # Frankfurt — change to was (Washington) or sin (Singapore) as preferred
    ports:
      - port: 8000
        protocol: http
    health_checks:
      - port: 8000
        path: /
        interval: 30
        timeout: 5
    env:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: error
      # APP_KEY should be set as a secret in the Koyeb dashboard, not here.
      # Run: php artisan key:generate --show  →  paste value into Koyeb secret
